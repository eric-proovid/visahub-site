<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VisaHub</title>
<meta name="description" content="VisaHub is under construction. Your Visa, Your Journey, Our Expertise.">
<meta property="og:title" content="VisaHub">
<meta property="og:description" content="Your Visa, Your Journey, Our Expertise. VisaHub is under construction.">
<meta property="og:url" content="https://visahub.me/">
<meta name="theme-color" content="#7c45f5">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Quicksand:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #7c45f5;
    --pink: #c0679a;
    --orange: #ff8a3d;
    --green: #00f696;
    --green-soft: #b9f7dd;
    --ink: #13202b;
    --white: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(90deg, var(--purple) 0%, var(--pink) 50%, var(--orange) 100%);
    color: var(--white);
    font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100svh;
  }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    align-items: center;
    gap: 2rem;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 3rem 2rem;
  }
  .copy { text-align: center; }
  h1 {
    font-weight: 700;
    font-size: clamp(2.3rem, 4.4vw, 4.2rem);
    line-height: 1.12;
    margin: 0 0 1.4rem;
  }
  .pill {
    display: inline-block;
    background: var(--green);
    color: var(--ink);
    font-family: "Quicksand", "Poppins", sans-serif;
    font-weight: 700;
    font-size: clamp(1rem, 1.9vw, 1.6rem);
    padding: .55em 1.2em;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0,0,0,.12);
  }
  .note {
    font-weight: 600;
    font-size: clamp(.9rem, 1.2vw, 1.05rem);
    line-height: 1.5;
    margin: 1.6rem 0 0;
  }
  .note a { color: var(--white); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .logo {
    display: block;
    width: min(340px, 70%);
    height: auto;
    margin: 2rem auto 0;
  }
  .art {
    position: relative;
    display: flex;
    justify-content: center;
  }
  .globe { position: relative; width: min(540px, 100%); aspect-ratio: 604 / 564; }
  .globe img { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity .8s ease; }
  .globe .day { opacity: 0; }
  .globe.is-day .day { opacity: 1; }
  .power {
    position: absolute; left: 18.5%; top: 61%; width: 19%; aspect-ratio: 1;
    border: 0; border-radius: 50%; background: transparent; cursor: pointer;
  }
  .power:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .stars span {
    position: absolute;
    color: #ffd75e;
    font-size: 14px;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  footer { height: 34px; display: flex; flex-direction: column; }
  footer .bar { flex: 3; background: var(--green); }
  footer .soft { flex: 1; background: var(--green-soft); }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; padding: 2rem 1rem; gap: .5rem; }
    .art { order: -1; }
    .globe { width: min(340px, 86%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .stars span { animation: none; opacity: .8; }
  }
</style>
</head>
<body>
<main>
  <section class="copy">
    <h1>Thanks for<br>visiting VisaHub</h1>
    <span class="pill">Your Visa, Your Journey, Our Expertise</span>
    <p class="note">VisaHub is under construction to serve you better.<br>
      Stay tuned for a seamless visa experience!</p>
    <p class="note">For inquiries, contact us at <a href="mailto:info@visahub.me">info@visahub.me</a></p>
    <img class="logo" src="assets/logo.png" width="700" height="175" alt="visa hub">
  </section>
  <section class="art">
    <div class="stars" aria-hidden="true">
      <span style="left:4%;top:8%">★</span><span style="left:94%;top:30%;animation-delay:1.2s">★</span>
      <span style="left:2%;top:62%;animation-delay:1.8s">★</span><span style="left:90%;top:90%;animation-delay:.9s">★</span>
    </div>
    <div class="globe">
      <img class="night" src="assets/globe-night.png" width="604" height="564" alt="">
      <img class="day" src="assets/globe-day.png" width="604" height="564" alt="">
      <button class="power" type="button" aria-label="Switch day and night"></button>
    </div>
  </section>
</main>
<footer><div class="bar"></div><div class="soft"></div></footer>
<script>
  (function () {
    var g = document.querySelector('.globe');
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var timer = null;
    function flip() { g.classList.toggle('is-day'); }
    function start() { if (!reduce) timer = setInterval(flip, 4000); }
    g.querySelector('.power').addEventListener('click', function () { clearInterval(timer); flip(); start(); });
    start();
  })();
</script>
</body>
</html>
